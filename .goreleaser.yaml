version: 2

project_name: neo

builds:
  - id: neo
    main: ./cmd/neo
    binary: neo
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}

archives:
  - id: neo
    ids:
      - neo
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  github:
    owner: morler
    name: neo
  # A dev tag is a test build, not the version people should install. Without
  # this, GoReleaser publishes it as the latest release and the installer's
  # "latest" lookup starts handing out a dev binary. The tag convention is
  # vX.Y.Z-dev.YYYYMMDD; stable releases carry no suffix and stay latest.
  prerelease: auto
  footer: |
    ## Install

    ```bash
    curl -fsSL https://raw.githubusercontent.com/morler/neo/main/install.sh | bash
    ```
